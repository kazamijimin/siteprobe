# Bind only to the private scanner-side proxy address.
http_port 10.20.0.2:3128
acl scanner src 10.20.0.10/32
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl blocked_destination dst "/etc/siteprobe/proxy/protected-ranges.acl"

# Squid resolves destinations itself. The blocked range ACL is checked again
# for each connection; Phase E pre-resolution is not trusted as enforcement.
dns_nameservers 10.20.0.53
forwarded_for delete
via off
request_header_access All deny all

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_destination
http_access allow scanner
http_access deny all

cache deny all
access_log stdio:/var/log/squid/siteprobe-access.log
coredump_dir /var/spool/squid
