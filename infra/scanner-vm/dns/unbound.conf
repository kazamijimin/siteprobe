server:
  interface: 10.20.0.53
  interface: fd42:51:5445:7072::53
  access-control: 10.20.0.10/32 allow
  access-control: fd42:51:5445:7072::10/128 allow
  access-control: 0.0.0.0/0 refuse
  access-control: ::0/0 refuse
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  do-not-query-localhost: yes
  hide-identity: yes
  hide-version: yes
  private-address: 10.0.0.0/8
  private-address: 100.64.0.0/10
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: fc00::/7
  private-address: fe80::/10

forward-zone:
  name: "."
  # Replace with the approved resolver for the deployment. The scanner UID
  # cannot reach this address directly; nftables allows it only to this daemon.
  forward-addr: 1.1.1.1@53
